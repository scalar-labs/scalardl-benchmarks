plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.6'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.google.inject', name: 'guice', version: '5.0.1'
    implementation group: 'com.scalar-labs', name: 'kelpie', version: '1.2.3'
    implementation group: 'com.scalar-labs', name: 'scalardl-java-client-sdk', version: '3.13.0'
    implementation group: 'io.github.resilience4j', name: 'resilience4j-retry', version: '1.3.1'
    implementation group: 'info.picocli', name: 'picocli', version: '4.7.7'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.10.2'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// The application plugin generates a launch script only for its single mainClass, so every further
// command needs its own CreateStartScripts task, added to the distribution's bin directory below.
def randomExecutorStartScripts = tasks.register('randomExecutorStartScripts', CreateStartScripts) {
    mainClass = 'com.scalar.dl.benchmarks.ycsb.RandomTrafficRunner'
    applicationName = 'random-executor'
    // Not under build/scripts: the application plugin copies that whole directory into the
    // distribution's bin, so a subdirectory of it would land there too.
    outputDir = layout.buildDirectory.dir('randomExecutorScripts').get().asFile
    classpath = files(tasks.named('jar')) + configurations.runtimeClasspath
}

application {
    mainClass = 'com.scalar.dl.benchmarks.ycsb.RecoveryStateSeeder'
    applicationName = 'recovery-seeder'
    applicationDistribution.into('bin') {
        from(randomExecutorStartScripts)
        filePermissions { unix(0755) }
    }
}

// The application plugin derives the main distribution name from applicationName, which would
// rename the whole suite's distribution to recovery-seeder.*. Keep the project name.
distributions {
    main {
        distributionBaseName = 'scalardl-benchmarks'
    }
}

// The application plugin also activates shadow's distribution tasks and wires them into assemble.
// Disabling them keeps `build` from producing two extra ~200-dependency archives. Note that
// shadowJar itself still runs as their dependency, which the Kelpie workflow needs anyway.
tasks.named('shadowDistZip') { enabled = false }
tasks.named('shadowDistTar') { enabled = false }

test {
    useJUnitPlatform()
}

// Note: shadow's application integration also injects `Main-Class: ...RecoveryStateSeeder` into
// this jar's manifest, and it cannot be removed from the build script. It is inert for the Kelpie
// workflow, which loads modules by class name rather than by manifest entry.
shadowJar {
    manifest {
        attributes(
                'Multi-Release': 'true'
        )
    }
    zip64 = true
    mergeServiceFiles()
    exclude 'com/scalar/dl/benchmarks/smallbank/contract/*'
    exclude 'com/scalar/dl/benchmarks/tpcc/contract/*'
    exclude 'com/scalar/dl/benchmarks/ycsb/contract/*'
}
